# Configuración mínima para servir Tesela UI.
# nginx no mapea .mjs a JavaScript por defecto y los navegadores exigen ese tipo MIME para los módulos ES.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location ~* \.mjs$ {
    default_type text/javascript;
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
